[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-predictor"
version = "0.1.0"
description = "Vector-based probability prediction for NBA and UFC outcomes, targeting Polymarket edge detection"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "De-Gin" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "python-dateutil>=2.8",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "nba_api>=1.4",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
sports-predictor = "predictor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]
